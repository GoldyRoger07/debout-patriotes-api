spring.application.name=api

spring.config.import=optional:file:.env.prod.properties

server.port=${PORT}

# --- Base de données MySQL ------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Le schéma est géré par Flyway (src/main/resources/db/migration) ; Hibernate se contente de le vérifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Instant -> DATETIME(6) (et non TIMESTAMP, limité à 2038 sous MySQL).
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.flyway.locations=${FLYWAY_LOCATIONS}

# --- Téléversements ---------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Sécurité ---------------------------------------------------------------
# Secret HMAC (au moins 32 caractères) servant à signer les jetons de l'espace d'administration.
app.security.jwt-secret=${JWT_SECRET}
app.security.token-validity=${JWT_VALIDITY}
# Origines autorisées à appeler l'API depuis un navigateur (séparées par des virgules).
app.security.cors-origins=${CORS_ORIGINS}

# Premier administrateur, créé au démarrage si aucun compte n'existe encore.
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
app.admin.display-name=${ADMIN_NAME}

# --- ImageKit.io -------------------------------------------------------------
app.imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
app.imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
app.imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}
# Dossier racine des images du site dans la médiathèque ImageKit.
app.imagekit.folder=${IMAGEKIT_FOLDER}
